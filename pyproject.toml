[project]
name = "digest"
version = "0.2.0"
description = "Compile transcripts, videos with audio, and slide decks into study context"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imagehash>=4.3.2",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.2.1,<2"]
